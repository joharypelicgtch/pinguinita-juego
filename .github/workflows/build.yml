name: Build

# Compila (exporta) el juego con Godot 4.3 en cada push / PR a main.
# Para publicar una versión descargable: crea un tag, p. ej. `git tag v0.1.0 && git push --tags`.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GAME_NAME: PipHogarDeCarton

jobs:
  export:
    name: Export ${{ matrix.preset }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: "Windows Desktop"
            dir: windows
            file: PipHogarDeCarton.exe
          - preset: "Linux"
            dir: linux
            file: PipHogarDeCarton.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar plantillas de exportación
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Importar proyecto
        run: godot --headless --verbose --import || true

      - name: Exportar
        run: |
          mkdir -v -p build/${{ matrix.dir }}
          godot --headless --verbose --export-release "${{ matrix.preset }}" "build/${{ matrix.dir }}/${{ matrix.file }}"

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GAME_NAME }}-${{ matrix.dir }}
          path: build/${{ matrix.dir }}
          if-no-files-found: error

  release:
    name: Publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Comprimir
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -r "../${d%/}-${{ github.ref_name }}.zip" .); done

      - name: Crear release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
